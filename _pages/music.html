<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hyunju Kim's concert record: orchestras, programmes, composers and stages since 2007.">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<style>
img{max-width:100%}
[hidden]{display:none !important}
</style>
<title>Hyunju's Concert Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400&family=Karla:ital,wght@0,400..700;1,400&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Handlee&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f7f7f7;
  --ink:#000000; --ink-2:#3a3a3a; --muted:#7d7d7d;
  --line:rgba(0,0,0,.13); --line-2:rgba(0,0,0,.07);
  --accent:#44cfba; --link:#0d8f7c; --qty:#0e7c6c; --qty-soft:#e4f6f2;
  --g1:#2a78d6; --g2:#eb6834; --g3:#1baf7a; --g4:#eda100; --g5:#e87ba4; --g6:#008300; --g7:#4a3aa7;
  --c1:#2a78d6; --c2:#eb6834; --c3:#4a3aa7; --c4:#eda100; --c5:#e87ba4; --c6:#008300;
  --tint:14%; --tint-g:6%; --tint-card:7%;
  --sans:"Karla","Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --serif:"Fraunces","Gowun Batang",Georgia,"Apple SD Gothic Neo",serif;
  --script:"Handlee","Fraunces",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#1c1c1d; --surface:#212529; --surface-2:#26292e;
    --ink:#e8e8e8; --ink-2:#c1c1c1; --muted:#8d8d8d;
    --line:#3d4147; --line-2:#2c3035;
    --accent:#66f0d2; --link:#66f0d2; --qty:#4fd3bd; --qty-soft:#1e2c2b;
    --g1:#3987e5; --g2:#d95926; --g3:#199e70; --g4:#c98500; --g5:#d55181; --g6:#008300; --g7:#9085e9;
    --c1:#3987e5; --c2:#d95926; --c3:#9085e9; --c4:#c98500; --c5:#d55181; --c6:#008300;
    --tint:22%; --tint-g:11%; --tint-card:13%;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1c1c1d; --surface:#212529; --surface-2:#26292e;
  --ink:#e8e8e8; --ink-2:#c1c1c1; --muted:#8d8d8d;
  --line:#3d4147; --line-2:#2c3035;
  --accent:#66f0d2; --link:#66f0d2; --qty:#4fd3bd; --qty-soft:#1e2c2b;
  --g1:#3987e5; --g2:#d95926; --g3:#199e70; --g4:#c98500; --g5:#d55181; --g6:#008300; --g7:#9085e9;
  --c1:#3987e5; --c2:#d95926; --c3:#9085e9; --c4:#c98500; --c5:#d55181; --c6:#008300;
  --tint:22%; --tint-g:11%; --tint-card:13%;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; font-weight:400; line-height:1.68; -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600}
a{color:var(--link); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--accent) 60%, transparent)}
a:hover{color:var(--ink); border-bottom-color:var(--ink)}
.wrap{max-width:900px; margin:0 auto; padding-inline:22px; padding-block:0 64px}
html[lang="ko"] body{line-height:1.74; word-break:keep-all}
html[lang="ko"] h1, html[lang="ko"] h2, html[lang="ko"] h3,
html[lang="ko"] .ens, html[lang="ko"] .tl-yr, html[lang="ko"] .dek{letter-spacing:-.02em}
html[lang="ko"] .prog .ttl{font-size:15.5px}
html[lang="ko"] .bio, html[lang="ko"] .secsub{letter-spacing:-.005em}
html[lang="ko"] .kicker, html[lang="ko"] .blockhead, html[lang="ko"] .region,
html[lang="ko"] .flab, html[lang="ko"] .subhead{letter-spacing:.02em}
.emo{font-style:normal; font-size:.95em; margin-right:.35em;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* contents */
.shell{display:grid; grid-template-columns:176px minmax(0,900px) 176px;
  justify-content:center; align-items:start}
/* no env() inside calc(): the site's CSS minifier reads the hyphens in
   safe-area-inset-top as subtraction and voids the whole declaration */
.toc{position:sticky; top:88px; margin-top:214px;
  width:150px; justify-self:end; z-index:20; padding-left:13px; border-left:2px solid var(--line);
  max-height:calc(100vh - 140px); overflow-y:auto}
.toc .tt{font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted);
  margin-bottom:7px}
.toc a{display:block; padding:4px 0; font-size:13px; line-height:1.3; color:var(--muted); border:0}
.toc a:hover{color:var(--link)}
.toc a .tn{font-family:var(--serif); font-size:11px; margin-right:7px; font-variant-numeric:tabular-nums}
.toc a.on{color:var(--ink); font-weight:600}
.toc a.on .tn{color:var(--accent)}
.toc-inline{display:none; gap:6px; flex-wrap:wrap; margin-top:22px}
.toc-inline a{font-size:12.5px; padding:3px 12px; border:1px solid var(--line); border-radius:999px;
  color:var(--ink-2); background:var(--surface)}
.toc-inline a .tn{color:var(--muted); margin-right:6px; font-family:var(--serif); font-size:11px}
@media (max-width:1260px){
  .shell{display:block}
  .toc{display:none}
  .toc-inline{display:flex}
}

/* colour ribbon */
.ribbon{display:flex; height:3px}
.ribbon i{flex:1}

/* navbar, mirroring the research site */
.nav{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--bg);
  border-bottom:1px solid var(--line-2)}
.nav-in{max-width:900px; margin:0 auto; padding-inline:22px; padding-block:12px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{font-family:var(--script); font-size:23px; color:var(--ink); border:0; line-height:1}
.brand:hover{color:var(--link)}
.navlinks{display:flex; gap:15px; margin-left:auto; align-items:center; flex-wrap:wrap}
.navlinks a{font-size:15px; color:var(--ink-2); border:0}
.navlinks a:hover{color:var(--link)}
.navlinks .here{font-size:15px; color:var(--ink); font-weight:600; border-bottom:2px solid var(--accent); padding-bottom:1px}
.langsw{display:flex; margin-left:4px; border:1px solid var(--line); border-radius:4px; overflow:hidden}
.langsw button{font:inherit; font-size:13px; padding:3px 10px; border:0; cursor:pointer;
  background:var(--surface); color:var(--muted)}
.langsw button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.langsw button:focus-visible{outline:2px solid var(--link); outline-offset:-2px}

/* hero */
.hero{padding-block:48px 30px}
.kicker{font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.hero h1{font-family:var(--serif); font-weight:600; font-size:clamp(40px,7.5vw,62px); line-height:1.02;
  letter-spacing:-.02em; margin-top:12px; font-variation-settings:"opsz" 120, "SOFT" 20}
.dek{font-family:var(--serif); font-size:20px; color:var(--ink-2); margin-top:14px; font-style:italic}
.bio{max-width:62ch; margin-top:20px; color:var(--ink-2); font-size:16.5px}
.tags{margin-top:18px; display:flex; flex-wrap:wrap; gap:8px}
.tag{font-size:13.5px; padding:4px 12px; border:1px solid var(--line); border-radius:999px; color:var(--ink-2);
  background:var(--surface)}
.tag.on{border-color:var(--accent); color:var(--qty); background:var(--qty-soft)}

.stats{display:grid; grid-template-columns:repeat(6,1fr); margin-top:32px;
  border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.stat{padding:16px 10px 15px; border-left:1px solid var(--line-2); border-top:3px solid transparent}
.stat:first-child{border-left:0; padding-left:0}
.stat b{display:block; font-family:var(--serif); font-weight:600; font-size:clamp(26px,3.8vw,34px);
  line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.stat span{display:block; margin-top:8px; font-size:12.5px; color:var(--muted); line-height:1.4}
@media (max-width:780px){.stats{grid-template-columns:repeat(3,1fr)}
  .stat{border-left:1px solid var(--line-2)}
  .stat:nth-child(3n+1){border-left:0; padding-left:0}}

/* sections */
section{padding-block:44px 0}
.sechead{margin-bottom:18px}
.sechead{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding-bottom:8px;
  border-bottom:1px solid var(--line)}
.sechead h2{font-family:var(--serif); font-size:28px; font-weight:600; letter-spacing:-.015em;
  font-variation-settings:"opsz" 60, "SOFT" 20}
.sechead .n{font-family:var(--serif); font-size:14px; color:var(--accent); font-variant-numeric:tabular-nums}
.sechead .note{font-size:13px; color:var(--muted); margin-left:auto}
.secsub{color:var(--ink-2); font-size:15.5px; max-width:68ch; margin:16px 0 20px}
.blockhead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  font-size:12.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  margin:38px 0 4px; padding-bottom:6px; border-bottom:1px solid var(--line)}
.blockhead .note{margin-left:auto; text-transform:none; letter-spacing:0; font-size:12.5px}

/* orchestras, on a year rail */
.timeline{position:relative; padding-left:30px}
.timeline::before{content:""; position:absolute; left:10px; top:16px; bottom:16px; width:2px;
  background:var(--line); border-radius:1px}
.tl-era{position:relative}
.tl-head{display:flex; align-items:baseline; gap:11px; flex-wrap:wrap; padding:13px 0 11px;
  border-bottom:1px solid var(--line-2)}
.tl-dot{position:absolute; left:-30px; top:14px; width:21px; height:21px; border-radius:50%;
  border:0; padding:0; cursor:pointer; color:#fff; font:inherit; font-size:14px; font-weight:700;
  line-height:19px; text-align:center; box-shadow:0 0 0 3px var(--bg)}
.tl-dot[aria-expanded="false"]{background:var(--bg) !important; box-shadow:0 0 0 3px var(--bg)}
.tl-dot:focus-visible{outline:2px solid var(--link); outline-offset:3px}
.tl-dot:hover{filter:brightness(1.12); transform:scale(1.1)}
.tl-dot{transition:transform .16s ease, filter .16s ease, color .2s ease}
.tl-yr{font-family:var(--serif); font-size:19px; font-weight:600; font-variant-numeric:tabular-nums;
  letter-spacing:-.01em}
.tl-nm{font-size:14.5px; color:var(--ink-2)}
.tl-ct{font-size:12.5px; color:var(--muted); margin-left:auto; font-variant-numeric:tabular-nums}
.tl-body{padding:10px 0 20px; overflow:hidden;
  transition:max-height .4s cubic-bezier(.4,0,.2,1), opacity .3s ease}
.tl-body[hidden]{display:none}
.ens-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(372px,1fr)); gap:0 26px}
.catlegend{display:flex; flex-wrap:wrap; gap:6px 16px; list-style:none; margin:0 0 16px; padding:0}
.catlegend li{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2)}
.catlegend .sw{width:10px; height:10px; border-radius:3px; flex:none}
.catlegend b{font-family:var(--serif); font-weight:600; font-variant-numeric:tabular-nums}
.ens-row{display:flex; flex-wrap:wrap; align-items:baseline; gap:3px 7px;
  padding:6px 8px 6px 0; border-bottom:1px solid var(--line-2); border-radius:4px;
  transition:background .16s ease, padding-left .16s ease}
.ens-row:hover{background:var(--surface-2); padding-left:7px}
.ens-row .en{font-size:15px; font-weight:600; color:var(--ink); line-height:1.4}
.ens-row .aff{font-size:12.5px; color:var(--muted)}
.ens-row .cpill{font-size:10px; font-weight:600; padding:1px 7px; border-radius:999px;
  position:relative; top:-1px; white-space:nowrap}
.ens-row .eg{font-size:10px; font-weight:600; border-radius:999px; padding:1px 7px;
  position:relative; top:-1px; white-space:nowrap;
  color:color-mix(in srgb, var(--g4) 72%, var(--ink));
  background:color-mix(in srgb, var(--g4) 17%, var(--surface));
  border:1px solid color-mix(in srgb, var(--g4) 46%, transparent)}
.ens-row .ec{font-family:var(--serif); font-size:16px; font-weight:600; color:var(--qty);
  font-variant-numeric:tabular-nums; margin-left:auto; padding-left:8px}

.subhead{display:flex; align-items:baseline; gap:8px; font-size:11px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted); margin:16px 0 9px; padding-bottom:4px;
  border-bottom:1px solid var(--line-2)}
.tl-body > .subhead:first-child{margin-top:2px}

/* cities */
.cities{display:flex; flex-direction:column; gap:7px}
.city{display:grid; grid-template-columns:minmax(100px,132px) 1fr auto; gap:14px; align-items:center}
.city .cl{font-size:14.5px; color:var(--ink-2); text-align:right}
.city .ct{position:relative; height:3px; background:var(--line-2); border-radius:2px}
.city .cf{position:absolute; left:0; top:-2px; height:7px; border-radius:3px}
.city .cd{position:absolute; top:-5px; width:13px; height:13px; border-radius:50%;
  box-shadow:0 0 0 2px var(--bg); transition:transform .18s ease}
.city:hover .cd{transform:scale(1.35)}
.city .cv{font-size:13.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; min-width:1.8em; text-align:right}
.region{display:flex; align-items:baseline; gap:8px; font-size:12.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); margin:18px 0 9px}
.region .rb{width:20px; height:3px; border-radius:2px; align-self:center}
.region:first-child{margin-top:4px}

/* treemap */
.seg{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px}
.seg button{font:inherit; font-size:13.5px; padding:4px 13px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--link); outline-offset:1px}
.scrollx{overflow-x:auto; padding-bottom:4px}
.tm{position:relative; min-width:700px; height:560px}
.tmg{position:absolute; border-radius:5px; border:1px solid var(--line-2)}
.tmg > .gbar{position:absolute; left:0; right:0; top:0; height:3px; border-radius:5px 5px 0 0}
.tmg > .gl{position:absolute; top:7px; left:9px; right:9px; font-size:12px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ink-2); white-space:nowrap; overflow:hidden}
.tmc{position:absolute; border-radius:3px; overflow:hidden; cursor:default;
  transition:filter .15s ease}
.tmc:hover{outline:2px solid var(--ink); outline-offset:-2px; filter:brightness(1.04)}
.tmc .cn{position:absolute; top:5px; left:8px; right:6px; bottom:20px; font-weight:500; color:var(--ink);
  line-height:1.16; overflow:hidden; overflow-wrap:break-word; letter-spacing:-.005em}
.tmc.short .cn{bottom:3px; right:26px}
.tmc.short .cv{bottom:auto; top:50%; transform:translateY(-50%); font-size:13px}
.tmc .cv{position:absolute; bottom:4px; right:8px; font-family:var(--serif); font-size:17px; font-weight:600;
  color:var(--ink); font-variant-numeric:tabular-nums; line-height:1}
.tmc .cy{position:absolute; bottom:5px; left:8px; font-size:11.5px; color:var(--muted);
  font-variant-numeric:tabular-nums; line-height:1}

/* chronicle */
.filters{margin-bottom:10px}
.fgroup{display:flex; gap:7px 6px; align-items:center; flex-wrap:wrap; padding:5px 0}
.fgroup + .fgroup{border-top:1px solid var(--line-2)}
.flab{font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  width:104px; flex:none}
@media (max-width:560px){.flab{width:100%}}
.filters button{font:inherit; font-size:13.5px; padding:4px 12px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--link); outline-offset:1px}
.entry{border-top:1px solid var(--line-2); padding:18px 0; display:grid;
  grid-template-columns:minmax(160px,228px) 1fr; gap:26px; scroll-margin-top:80px}
.entry:first-child{border-top:1px solid var(--line)}
.entry .ens{font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.28; letter-spacing:-.01em}
.entry .aff{font-size:13px; color:var(--ink-2); margin-top:3px}
.entry .date{font-size:13px; color:var(--muted); margin-top:5px; font-variant-numeric:tabular-nums}
.entry .hall{font-size:13.5px; color:var(--muted); margin-top:3px}
.chairs{display:flex; flex-wrap:wrap; gap:4px 5px; align-items:center; margin-top:9px}
.chairline{display:contents}
.chip{font-size:11px; font-weight:600; padding:2px 9px; border-radius:999px; color:#fff;
  white-space:nowrap}
.chip.reg{background:transparent}
.prog{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px}
.prog li{font-size:15.5px; line-height:1.5}
.prog .cmp{font-weight:600}
.prog .ttl{font-family:var(--serif); font-size:16px; color:var(--ink-2)}
.prog .nte{font-size:12.5px; color:var(--muted)}
.prog .sep{color:var(--muted); padding:0 6px}
@media (max-width:660px){.entry{grid-template-columns:1fr; gap:12px}}

/* full chronicle head */
.chronhead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:46px 0 0;
  padding-bottom:11px; border-bottom:2px solid var(--line)}
.chronhead h3{font-family:var(--serif); font-size:24px; font-weight:600; letter-spacing:-.015em;
  cursor:pointer; white-space:nowrap}
.chronhead h3:hover{color:var(--link)}
.chronhead .sfield{margin-left:auto; flex:0 1 330px; min-width:170px; padding:5px 13px}
.chronbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:13px 0 4px}
#chron-panel{overflow:hidden; transition:max-height .42s cubic-bezier(.4,0,.2,1), opacity .3s ease}
.chron-inner{margin:14px 0 0 12px; padding-left:20px; border-left:2px solid var(--line)}
@keyframes slideOut{
  from{opacity:0; transform:translateX(-22px)}
  to{opacity:1; transform:none}
}
#chron-list.anim > .erahead, #chron-list.anim > .entry{
  animation:slideOut .4s cubic-bezier(.22,1,.36,1) both}
@media (max-width:560px){.chron-inner{margin-left:0; padding-left:13px}}
.chronbar .note{margin-left:auto; font-size:12.5px; color:var(--muted); white-space:nowrap}
.sfield{display:flex; align-items:center; gap:8px; padding:7px 14px;
  border:1px solid var(--line); border-radius:999px; background:var(--surface)}
.sfield:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--qty-soft)}
.sfield input{flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink);
  font:inherit; font-size:14.5px}
.sfield input::placeholder{color:var(--muted)}
.expander{flex:none; display:flex; align-items:center; gap:7px; font:inherit; font-size:13.5px;
  padding:5px 15px; border-radius:999px; cursor:pointer; white-space:nowrap;
  border:1px solid var(--ink); background:var(--ink); color:var(--bg)}
.expander .ecar{font-size:11px; display:inline-block; transition:transform .18s ease}
.expander[aria-expanded="true"] .ecar{transform:rotate(180deg)}
.expander:focus-visible{outline:2px solid var(--link); outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .expander .ecar, .tmc, .tl-body, .tl-dot, .ens-row, .city .cd,
  #chron-panel{transition:none}
  #chron-list.anim > .erahead, #chron-list.anim > .entry{animation:none}
}
.nohits{padding:22px 0; color:var(--muted); font-size:14.5px}
.erahead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:26px 0 0;
  padding-bottom:6px; border-bottom:2px solid var(--line)}
.erahead .eh-yr{font-family:var(--serif); font-size:18px; font-weight:600;
  font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.erahead .eh-nm{font-size:14px; color:var(--ink-2)}
.erahead .eh-ct{font-size:12.5px; color:var(--muted); margin-left:auto; font-variant-numeric:tabular-nums}

/* favourites */
.favgrid{columns:2; column-gap:18px; margin-top:22px}
.favcol{break-inside:avoid; margin-bottom:18px}
@media (max-width:700px){.favgrid{columns:1}}
.favcol{padding:18px 20px 8px; border-radius:8px; border:1px solid var(--line-2)}

<script>
/* ---------------------------------------------------------------- render */
const $ = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c) n.className=c; if(x!=null) n.textContent=x; return n; };
let L = "en";
try { const v = localStorage.getItem("hj-lang"); if (v==="ko"||v==="en") L=v; } catch(e){}
const T = o => o ? (o[L] || o.en) : "";
const KO = () => L==="ko";
const uniq = a => [...new Set(a.filter(Boolean))];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* hue per national tradition, per period, per region */
const HUE_S = {ga:"--g1", ru:"--g2", fr:"--g3", cz:"--g4", nd:"--g5", gb:"--g6", xx:"--g7"};
const HUE_P = {cl:"--g1", ro:"--g2", lr:"--g3", mo:"--g4"};
const HUE_R = {metro:"--g1", korea:"--g3", eu:"--g7", us:"--g2"};
const hue = v => "var(" + v + ")";
const tint = (v,pct) => "color-mix(in srgb, var("+v+") "+pct+", var(--surface))";

/* ---- derived ---- */
const allWorks = SHOWS.flatMap(s=>s.prog);
const composerCount = {};
allWorks.forEach(x=>{ composerCount[x.c] = (composerCount[x.c]||0)+1; });
const composerRank = Object.entries(composerCount)
  .sort((a,b)=> b[1]-a[1] || C[a[0]].en.localeCompare(C[b[0]].en));
const worksBy = {};
allWorks.forEach(x=>{
  const m = worksBy[x.c] = worksBy[x.c] || {};
  const k = x.en;
  (m[k] = m[k] || {n:0, w:x}).n++;
});
const hallCount = TOUR.length +
  uniq(SHOWS.filter(s=>!s.cities).map(s=> s.hall && s.hall.en)).length;
const cityCount = (()=>{
  const m = {}; let miss = 0;
  SHOWS.forEach(s=> (s.cities || [s.city]).forEach(c=> c ? m[c]=(m[c]||0)+1 : miss++));
  return {m, miss, total: Object.values(m).reduce((a,b)=>a+b,0)};
})();

const STATS = [
  {v:19, en:"years playing", ko:"년간 연주"},
  {v:SHOWS.length, en:"concerts", ko:"공연"},
  {v:Object.keys(ORCH).length, en:"orchestras", ko:"오케스트라"},
  {v:hallCount, en:"halls", ko:"홀"},
  {v:allWorks.length, en:"works played", ko:"연주한 곡"},
  {v:composerRank.length, en:"composers", ko:"작곡가"}
];
const STAT_HUE = ["--g1","--g2","--g3","--g4","--g5","--g7"];
const STAT_EMO = ["🕰️","🎫","🏫","🏛️","🎵","🖋️"];
const REG_EMO  = {metro:"🏙️", korea:"⛰️", eu:"✈️", us:"🍑"};
const FAV_EMO  = ["🎼","🎹","🎭"];
const ERA_EMO  = {e1:"✈️", e2:"🎒", e3:"🎓", e4:"🏙️", e5:"🍑"};
const ERA_HUE  = {e1:"--g7", e2:"--g5", e3:"--g4", e4:"--g1", e5:"--g2"};
const AREA = {
  kr:{en:"Korea", ko:"한국", v:"--g3"},
  eu:{en:"Europe", ko:"유럽", v:"--g7"},
  us:{en:"United States", ko:"미국", v:"--g2"}
};
function areasOf(s){
  const set = new Set();
  (s.cities || [s.city]).forEach(c=>{
    const rg = c && CITY[c] && CITY[c].r;
    if (rg==="metro" || rg==="korea") set.add("kr");
    else if (rg==="eu") set.add("eu");
    else if (rg==="us") set.add("us");
  });
  return [...set];
}
const softChip = (node, v) => {
  node.style.color = "color-mix(in srgb, var("+v+") 72%, var(--ink))";
  node.style.background = "color-mix(in srgb, var("+v+") 17%, var(--surface))";
  node.style.border = "1px solid color-mix(in srgb, var("+v+") 46%, transparent)";
};

/* ---- tooltip ---- */
const tip = $("#tip"); let tipOn = false;
function showTip(html, x, y){
  tip.innerHTML = html; tip.style.opacity = "1"; tipOn = true;
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 16;
  if (left + r.width > innerWidth - 8) left = Math.max(8, x - r.width - 14);
  if (top + r.height > innerHeight - 8) top = Math.max(8, y - r.height - 16);
  tip.style.left = left+"px"; tip.style.top = top+"px";
}
function hideTip(){ if(tipOn){ tip.style.opacity="0"; tipOn=false; } }
function hover(node, html){
  node.addEventListener("mouseenter", e=> showTip(html(), e.clientX, e.clientY));
  node.addEventListener("mousemove",  e=> showTip(html(), e.clientX, e.clientY));
  node.addEventListener("mouseleave", hideTip);
}
addEventListener("scroll", hideTip, {passive:true});

/* ---- header numbers ---- */
function buildStats(){
  const box = $("#stats"); box.innerHTML = "";
  STATS.forEach((s,i)=>{
    const d = el("div","stat");
    d.style.borderTopColor = hue(STAT_HUE[i]);
    d.appendChild(el("b",null,String(s.v)));
    const lab = el("span");
    const e = el("i","emo",STAT_EMO[i]);
    lab.appendChild(e); lab.appendChild(document.createTextNode(T(s)));
    d.appendChild(lab);
    box.appendChild(d);
  });
}

/* ---- orchestras, grouped on a year rail ---- */
const OPEN = {};
ERAS.forEach(e=> OPEN[e.id] = true);
function buildCatLegend(){
  const ul = $("#cat-legend"); ul.innerHTML = "";
  const n = {}; Object.values(ORCH).forEach(o=> n[o.cat] = (n[o.cat]||0)+1);
  ["uni","work","youth"].forEach(k=>{
    if(!n[k]) return;
    const li = el("li");
    const sw = el("span","sw"); sw.style.background = hue(CAT[k].v);
    li.appendChild(sw);
    li.appendChild(el("b",null,String(n[k])));
    li.appendChild(el("span",null,T(CAT[k])));
    ul.appendChild(li);

}
/* ---- stages by city ---- */
function buildCities(){
  const box = $("#city-list"); box.innerHTML = "";
  const max = Math.max(...Object.values(cityCount.m));
  REGORDER.forEach(r=>{
    const rows = Object.entries(cityCount.m)
      .filter(([k])=> CITY[k] && CITY[k].r===r)
      .sort((a,b)=> b[1]-a[1]);
    if(!rows.length) return;
    const total = rows.reduce((a,b)=>a+b[1],0);
    const h = el("div","region");
    const bar = el("span","rb"); bar.style.background = hue(HUE_R[r]);
    h.appendChild(bar);
    h.appendChild(el("i","emo", REG_EMO[r] || ""));
    h.appendChild(el("span",null, T(REG[r]) + "  ·  " + total));
    box.appendChild(h);
    const list = el("div","cities");
    rows.forEach(([k,n])=>{
      const row = el("div","city");
      row.appendChild(el("div","cl", T(CITY[k])));
      const trk = el("div","ct");
      const fil = el("div","cf");
      fil.style.width = (n/max*100)+"%"; fil.style.background = hue(HUE_R[r]);
      const dot = el("div","cd");
      dot.style.left = "calc("+(n/max*100)+"% - 6px)"; dot.style.background = hue(HUE_R[r]);
      trk.appendChild(fil); trk.appendChild(dot);
      row.appendChild(trk);
      row.appendChild(el("div","cv", String(n)));
      hover(row, ()=>{
        const halls = [];
        SHOWS.forEach(s=>{
          if (s.cities){ s.cities.forEach((c,i)=>{ if(c===k && TOUR[i]) halls.push(T(TOUR[i].hall)); }); }
          else if (s.city===k && s.hall) halls.push(T(s.hall));
        });
        return "<b>"+esc(T(CITY[k]))+"</b><span class='sub'>"+n+(KO()?"회 무대":n===1?" stage":" stages")+"</span>"
          + "<ol>"+uniq(halls).map(x=>"<li>"+esc(x)+"</li>").join("")+"</ol>";
      });
      list.appendChild(row);
    });
    box.appendChild(list);
  });
  $("#where-note").textContent = KO()
    ? cityCount.total + "개 무대 · " + hallCount + "개 홀"
    : cityCount.total + " stages · " + hallCount + " halls";
}

/* ---- chronicle ---- */
function progLine(x){
  const li = el("li");
  const m = M[x.c];
  const cmp = el("span","cmp", T(C[x.c]));
  if (m) cmp.style.color = hue(HUE_S[m.s]);
  li.appendChild(cmp);
  li.appendChild(el("span","sep","·"));

  const n = KO() ? x.nk : x.ne;
  if (n){ li.appendChild(document.createTextNode(" ")); li.appendChild(el("span","nte","("+n+")")); }
  return li;
}
const FQ = {part:"all", area:"all", seat:"all"};
function buildFilters(){
  const box = $("#chron-filters"); box.innerHTML = "";
  const groups = [
    {key:"part", lab:{en:"Instrument", ko:"악기"},
     opts:[{k:"all", en:"All", ko:"전체"}].concat(PORDER.map(p=>({k:p, en:P[p].s, ko:P[p].s})))},
    {key:"area", lab:{en:"Where", ko:"지역"},
     opts:[{k:"all", en:"All", ko:"전체"},
           {k:"kr", en:"Korea", ko:"한국"},
           {k:"eu", en:"Europe", ko:"유럽"},
           {k:"us", en:"United States", ko:"미국"}]},
    {key:"seat", lab:{en:"Seat", ko:"구분"},
     opts:[{k:"all", en:"All", ko:"전체"},
           {k:"guest", en:"Guest", ko:"객원"},
           {k:"own", en:"My own", ko:"소속"}]}
  ];
  groups.forEach(g=>{
    const row = el("div","fgroup");
    row.appendChild(el("span","flab", T(g.lab)));
    g.opts.forEach(o=>{
      const b = el("button",null,T(o));
      b.type = "button";
      b.setAttribute("aria-pressed", String(FQ[g.key]===o.k));
      b.addEventListener("click", ()=>{ FQ[g.key]=o.k; buildFilters(); buildChronicle(); });
      row.appendChild(b);
    });
    box.appendChild(row);
  });
}
const OPENC = {};
ERAS.forEach(e=> OPENC[e.id] = true);

function setFold(body, open){
  if (reduced()){ body.hidden = !open; body.style.maxHeight = ""; body.style.opacity = ""; return; }
  const done = e => {
    if (e.propertyName !== "max-height") return;
    body.removeEventListener("transitionend", done);
    if (open) body.style.maxHeight = "none";
    else { body.hidden = true; body.style.maxHeight = ""; }
  };
  body.addEventListener("transitionend", done);
  if (open){
    body.hidden = false;
    body.style.maxHeight = "0px"; body.style.opacity = "0";
    const h = body.scrollHeight;
    requestAnimationFrame(()=>{ body.style.maxHeight = h + "px"; body.style.opacity = "1"; });
  } else {
    body.style.maxHeight = body.scrollHeight + "px";
    requestAnimationFrame(()=>{ body.style.maxHeight = "0px"; body.style.opacity = "0"; });
  }
}

function eraHead(era, count, body){
  const wrap = el("div","tl-era");
  const dot = el("button","tl-dot", OPENC[era.id] ? "−" : "+");
  dot.type = "button";
  dot.style.background = hue(ERA_HUE[era.id]);
  dot.style.boxShadow = "0 0 0 3px var(--bg), inset 0 0 0 2px " + hue(ERA_HUE[era.id]);
  dot.style.color = OPENC[era.id] ? "#fff" : hue(ERA_HUE[era.id]);
  dot.setAttribute("aria-expanded", String(!!OPENC[era.id]));
  dot.setAttribute("aria-label", era.yr);
  const head = el("div","tl-head");
  head.appendChild(el("span","tl-yr", era.yr));
  const nm = el("span","tl-nm");
  nm.appendChild(el("i","emo", ERA_EMO[era.id] || ""));
  nm.appendChild(document.createTextNode(T(era)));
  head.appendChild(nm);
  head.appendChild(el("span","tl-ct", count));
  dot.addEventListener("click", ()=>{
    OPENC[era.id] = !OPENC[era.id];
    setFold(body, OPENC[era.id]);
    dot.textContent = OPENC[era.id] ? "−" : "+";
    dot.style.color = OPENC[era.id] ? "#fff" : hue(ERA_HUE[era.id]);
    dot.setAttribute("aria-expanded", String(!!OPENC[era.id]));
  });
  wrap.appendChild(dot); wrap.appendChild(head); wrap.appendChild(body);
  return wrap;
}

/* what we played together, condensed */
function worksSummary(shows, cap){
  const m = {};
  shows.forEach(s=> s.prog.forEach(x=>{
    const k = x.c + "|" + x.en;
    (m[k] = m[k] || {n:0, x}).n++;
  }));
  const all = Object.values(m).sort((a,b)=> b.n-a.n || a.x.en.localeCompare(b.x.en));
  const shown = all.slice(0, cap);
  return "<ol>" + shown.map(it=>
      "<li><span>" + esc(T(C[it.x.c])) + " · " + esc(KO() ? it.x.ko : it.x.en) + "</span>"
      + (it.n > 1 ? "<em>×" + it.n + "</em>" : "") + "</li>").join("")
    + (all.length > cap
        ? "<li><em>" + (KO() ? "외 " + (all.length-cap) + "곡" : "and " + (all.length-cap) + " more") + "</em></li>"
        : "") + "</ol>";
}

function orchRow(eid, shows, yr){
  const o = ORCH[eid];
  const n = shows.length;
  const guest = shows.filter(s=>s.g).length;
  const row = el("div","ens-row");
  row.appendChild(el("span","en", T(o.sn || o.name)));
  const cp = el("span","cpill", T(CAT[o.cat]));
  softChip(cp, CAT[o.cat].v);
  row.appendChild(cp);
  if (guest) row.appendChild(el("span","eg", KO() ? "객원" : "guest"));
  if (o.aff) row.appendChild(el("span","aff", T(o.aff)));
  row.appendChild(el("span","ec", String(n)));
  hover(row, ()=> "<b>" + esc(T(o.name)) + "</b><span class='sub'>" + yr + " · "
    + n + (KO()?"회":n===1?" concert":" concerts")
    + (guest ? " · " + guest + (KO()?"회 객원":" as guest") : "") + "</span>"
    + worksSummary(shows, 7));
  return row;
}

/* ---- full chronicle: search, filters, every programme ---- */
function entryCard(s, i){
  const d = el("div","entry"); d.id = "show-"+i;
  const who = el("div","who");
  const orc = ORCH[s.eid] || {name:s.ens};
  who.appendChild(el("div","ens", T(orc.name) + (s.pt ? " · “" + T(s.pt) + "”" : "")));
  if (orc.aff) who.appendChild(el("div","aff", T(orc.aff)));
  if (s.date) who.appendChild(el("div","date", T(s.date)));
  const city = (!s.cities && s.city && CITY[s.city]) ? T(CITY[s.city]) : "";
  who.appendChild(el("div","hall", s.hall ? T(s.hall) + (city ? " · " + city : "")
    : (city ? city + (KO() ? " · 장소 기록 없음" : " · venue not recorded")
            : (KO() ? "장소 기록 없음" : "venue not recorded"))));
  const chairs = el("div","chairs");
  s.parts.forEach(p=>{
    const c = el("span","chip", P[p].s);
    c.style.background = hue(P[p].v);
    if (P[p].tx) c.style.color = P[p].tx;
    chairs.appendChild(c);
  });
  areasOf(s).forEach(a=>{
    const c = el("span","chip reg", T(AREA[a]));
    c.style.color = "color-mix(in srgb, var("+AREA[a].v+") 74%, var(--ink))";
    c.style.border = "1px solid color-mix(in srgb, var("+AREA[a].v+") 52%, transparent)";
    chairs.appendChild(c);
  });
  if (s.g){
    const seat = el("span","chip seat", KO() ? "객원" : "Guest");
    softChip(seat, "--g4");
    chairs.appendChild(seat);
  }
  who.appendChild(chairs);
  d.appendChild(who);
  const ul = el("ul","prog");
  s.prog.forEach(x=> ul.appendChild(progLine(x)));
  d.appendChild(ul);
  return d;
}

const norm = s => String(s||"").toLowerCase().replace(/[\s·.,'"“”‘’\-()]/g,"");
function haystack(s){
  if (s._h) return s._h;
  const bits = [];
  const push = o => { if(o){ bits.push(o.en); bits.push(o.ko); } };
  const orc = ORCH[s.eid];
  if (orc){ push(orc.name); push(orc.sn); push(orc.aff); bits.push(T(CAT[orc.cat]), CAT[orc.cat].ko, CAT[orc.cat].en); }
  push(s.hall); push(s.pt); push(s.date);
  const era = ERAS.find(e=>e.id===s.e);
  if (era){ bits.push(era.yr); push(era); }
  (s.cities || [s.city]).forEach(c=>{ if(c && CITY[c]) push(CITY[c]); });
  s.parts.forEach(p=> bits.push(P[p].s, P[p].en, P[p].ko));
  s.prog.forEach(x=>{
    bits.push(C[x.c].en, C[x.c].ko, x.en, x.ko, ALIAS[x.c] || "");
    const m = M[x.c];
    if (m){ if(m.s) push(SCH[m.s]); if(m.p) push(PER[m.p]); }
  });
  if (s.g) bits.push("guest","객원");
  s._h = norm(bits.filter(Boolean).join(" "));
  return s._h;
}

let chronOpen = false, chronQ = "", chronVisible = false, animateItems = false;
function slidePanel(open){
  const p = $("#chron-panel");
  if (reduced()){ p.hidden = !open; p.style.maxHeight = ""; return; }
  const done = e => {
    if (e.propertyName !== "max-height") return;
    p.removeEventListener("transitionend", done);
    if (open) p.style.maxHeight = "none";
    else { p.hidden = true; p.style.maxHeight = ""; }
  };
  p.addEventListener("transitionend", done);
  if (open){
    p.hidden = false;
    p.style.maxHeight = "0px";
    const h = p.scrollHeight;
    requestAnimationFrame(()=>{ p.style.maxHeight = h + "px"; });
  } else {
    p.style.maxHeight = p.scrollHeight + "px";
    requestAnimationFrame(()=>{ p.style.maxHeight = "0px"; });
  }
}
function buildChronicle(){
  const panel = $("#chron-panel"), box = $("#chron-list"), btn = $("#chron-toggle");
  const q = norm(chronQ);
  const rows = SHOWS.map((s,i)=>({s,i})).reverse().filter(o=>{
    const s = o.s;
    if (FQ.part !== "all" && !s.parts.includes(FQ.part)) return false;
    if (FQ.area !== "all" && !areasOf(s).includes(FQ.area)) return false;
    if (FQ.seat === "guest" && !s.g) return false;
    if (FQ.seat === "own"   &&  s.g) return false;
    if (q && haystack(s).indexOf(q) < 0) return false;
    return true;
  });
  const show = chronOpen || !!q;
  btn.setAttribute("aria-expanded", String(show));
  btn.querySelector(".etxt").textContent = show
    ? (KO() ? "접기" : "Collapse")
    : (KO() ? "펼치기" : "Expand");
  $("#chron-note").textContent = q || FQ.part!=="all" || FQ.area!=="all" || FQ.seat!=="all"
    ? (KO() ? rows.length + "개 찾음" : rows.length + (rows.length===1?" match":" matches"))
    : (KO() ? "프로그램 " + SHOWS.length + "개" : SHOWS.length + " programmes");
  if (!show){
    if (chronVisible){ chronVisible = false; slidePanel(false); }
    return;
  }
  box.innerHTML = "";
  if (!rows.length){
    if (!chronVisible){ chronVisible = true; slidePanel(true); } else panel.hidden = false;
    box.appendChild(el("div","nohits", KO()
      ? "찾는 프로그램이 없습니다. 차이코프스키, 말러, 핀란디아, 무지크페라인처럼 검색해 보세요."
      : "Nothing matches. Try: Tchaikovsky, Mahler, Finlandia, Musikverein"));
    return;
  }
  ERAS.slice().reverse().forEach(era=>{
    const mine = rows.filter(o=>o.s.e===era.id);
    if(!mine.length) return;
    const h = el("div","erahead");
    h.appendChild(el("span","eh-yr", era.yr));
    const nm = el("span","eh-nm");
    nm.appendChild(el("i","emo", ERA_EMO[era.id] || ""));
    nm.appendChild(document.createTextNode(T(era)));
    h.appendChild(nm);
    h.appendChild(el("span","eh-ct", KO() ? mine.length + "개"
      : mine.length + (mine.length===1?" programme":" programmes")));
    box.appendChild(h);
    mine.forEach(o=> box.appendChild(entryCard(o.s, o.i)));
  });
  if (!chronVisible){ chronVisible = true; slidePanel(true); }
  else panel.hidden = false;
  if (animateItems && !reduced()){
    animateItems = false;
    const items = box.querySelectorAll(":scope > .erahead, :scope > .entry");
    box.classList.add("anim");
    items.forEach((n,idx)=> n.style.animationDelay = Math.min(idx*28, 560) + "ms");
    setTimeout(()=>{
      box.classList.remove("anim");
      items.forEach(n=> n.style.animationDelay = "");
    }, 1200);
  }
}

/* ---- squarified treemap ---- */
function squarify(items, x, y, w, h){
  const out = []; const rest = items.slice();
  let total = rest.reduce((a,b)=>a+b.v,0);
  let rx=x, ry=y, rw=w, rh=h;
  while(rest.length){
    if(rw<=0.5 || rh<=0.5 || total<=0){ rest.forEach(c=>out.push({d:c,x:rx,y:ry,w:0,h:0})); break; }
    const horiz = rw >= rh;
    const side  = horiz ? rh : rw;
    const scale = (rw*rh)/total;
    let row=[], sum=0, best=Infinity;
    while(rest.length){
      const cand = row.concat([rest[0]]);
      const s2 = sum + rest[0].v;
      const len = Math.max(1e-6, s2*scale/side);
      let worst = 0;
      for(const c of cand){
        const l = Math.max(1e-6, c.v*scale/len);
        worst = Math.max(worst, len/l, l/len);
      }
      if(row.length===0 || worst<=best){ best=worst; row=cand; sum=s2; rest.shift(); }
      else break;
    }
    const len = Math.max(1e-6, sum*scale/side);
    let off = 0;
    row.forEach(c=>{
      const l = c.v*scale/len;
      if(horiz) out.push({d:c, x:rx, y:ry+off, w:len, h:l});
      else      out.push({d:c, x:rx+off, y:ry, w:l, h:len});
      off += l;
    });
    if(horiz){ rx+=len; rw-=len; } else { ry+=len; rh-=len; }
    total -= sum;
  }
  return out;
}

/* pick the largest size at which the label still fits its box */
function fitSize(text, w, h){
  const avail = Math.max(10, w - 15);
  const maxH  = Math.max(10, h - (h >= 40 ? 24 : 6));
  const longest = text.split(/[\s·\/-]+/).reduce((a,b)=> b.length > a.length ? b : a, "");
  for (let fs = 14.5; fs >= 7; fs -= 0.5){
    const cw = fs * 0.66;
    if (longest.length * cw > avail) continue;
    const lines = Math.max(1, Math.ceil(text.length * cw / avail));
    if (lines * fs * 1.16 <= maxH) return fs;
  }
  return 0;
}

let groupBy = "s";                     /* "s" tradition, "p" period */
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

function buildSeg(){
  const box = $("#comp-seg"); box.innerHTML = "";
  [{k:"s", en:"By tradition", ko:"나라별"}, {k:"p", en:"By period", ko:"시대별"}].forEach(o=>{
    const b = el("button",null,T(o));
    b.type = "button";
    b.setAttribute("aria-pressed", String(groupBy===o.k));
    b.addEventListener("click", ()=>{ groupBy=o.k; buildSeg(); buildTreemap(); });
    box.appendChild(b);
  });
}

function buildTreemap(){
  const box = $("#treemap"); box.innerHTML = "";
  const W = Math.max(700, box.getBoundingClientRect().width || 700);
  const H = 560;
  const DICT = groupBy==="s" ? SCH : PER;
  const HUES = groupBy==="s" ? HUE_S : HUE_P;
  const ORDER = groupBy==="s" ? null : ["cl","ro","lr","mo"];
  const bag = {};
  composerRank.forEach(([k,n])=>{
    const g = (M[k] && M[k][groupBy]) || "xx";
    (bag[g] = bag[g] || []).push({k, v:n});
  });
  let groups = Object.keys(bag).map(g=>({
    g, v: bag[g].reduce((a,b)=>a+b.v,0), kids: bag[g]
  }));
  groups = ORDER ? groups.sort((a,b)=> ORDER.indexOf(a.g)-ORDER.indexOf(b.g))
                 : groups.sort((a,b)=> b.v-a.v);
  squarify(groups, 0, 0, W, H).forEach(g=>{
    const gk = g.d.g;
    const hv = HUES[gk] || "--g7";
    const G = el("div","tmg");
    G.style.cssText = `left:${g.x+1}px; top:${g.y+1}px; width:${g.w-2}px; height:${g.h-2}px;`
      + `background:${tint(hv,"var(--tint-g)")}; border-color:${"color-mix(in srgb, var("+hv+") 34%, transparent)"}`;
    const gb = el("div","gbar"); gb.style.background = hue(hv);
    G.appendChild(gb);
    G.appendChild(el("div","gl", T(DICT[gk]) + " · " + g.d.v));
    box.appendChild(G);
    const px = 6, pt = 32;
    squarify(g.d.kids, g.x+1+px, g.y+1+pt, Math.max(2,g.w-2-px*2), Math.max(2,g.h-2-pt-px))
      .forEach(c=>{
        const k = c.d.k, n = c.d.v, m = M[k] || {};
        const N = el("div","tmc");
        N.style.cssText = `left:${c.x+1}px; top:${c.y+1}px; width:${Math.max(0,c.w-2)}px; height:${Math.max(0,c.h-2)}px;`
          + `background:${tint(hv,"var(--tint)")}; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(${hv}) 40%, transparent)`;
        const short = c.h < 40;
        if (short) N.classList.add("short");
        const label = m.sh ? T(m.sh) : T(C[k]);
        const fs = fitSize(label, short ? c.w - 22 : c.w, c.h);
        if (fs){
          const cn = el("div","cn", label);
          cn.style.fontSize = fs + "px";
          N.appendChild(cn);
        }
        if (c.w >= 24 && c.h >= 20) N.appendChild(el("div","cv", String(n)));
        if (c.w >= 88 && c.h >= 58 && m.b) N.appendChild(el("div","cy", m.b + "–" + (m.d || "")));
        hover(N, ()=>{
          const items = Object.values(worksBy[k] || {}).sort((a,b)=> b.n-a.n || a.w.en.localeCompare(b.w.en));
          const shown = items.slice(0,9);
          const more = items.length - shown.length;
          return "<b>"+esc(T(C[k]))+"</b><span class='sub'>"
            + (m.b ? m.b + "–" + (m.d || (KO()?"현재":"present")) + " &middot; " : "")
            + esc(m.s ? T(SCH[m.s]) : "") + " &middot; " + esc(m.p ? T(PER[m.p]) : "") + "</span><ol>"
            + shown.map(it=> "<li><span>"+esc(KO()?it.w.ko:it.w.en)+"</span>"
                + (it.n>1 ? "<em>×"+it.n+"</em>" : "") + "</li>").join("")
            + (more>0 ? "<li><em>"+(KO()? "외 "+more+"곡" : "and "+more+" more")+"</em></li>" : "")
            + "</ol>";
        });
        box.appendChild(N);
      });
  });
  $("#comp-note").textContent = KO()
    ? "작곡가 " + composerRank.length + "명 · " + allWorks.length + "곡"
    : composerRank.length + " composers · " + allWorks.length + " works";
}

/* ---- contents ---- */
const TOC = [
  {id:"record",    n:"01", en:"The record",  ko:"연주 기록"},
  {id:"composers", n:"02", en:"Composers",    ko:"작곡가"},
  {id:"where",     n:"03", en:"Stages",       ko:"무대"},
  {id:"favorites", n:"04", en:"Favourites",   ko:"좋아하는 곡"}
];
let spy = null;
function buildToc(){
  const side = $("#toc"), inline = $("#toc-inline");
  side.querySelectorAll("a").forEach(a=>a.remove());
  inline.innerHTML = "";
  TOC.forEach(t=>{
    [side, inline].forEach(host=>{
      const a = el("a");
      a.href = "#" + t.id;
      a.dataset.sec = t.id;
      a.appendChild(el("span","tn", t.n));
      a.appendChild(document.createTextNode(T(t)));
      host.appendChild(a);
    });
  });
  if (spy) spy.disconnect();
  spy = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      document.querySelectorAll("#toc a").forEach(a=>
        a.classList.toggle("on", a.dataset.sec === en.target.id));
    });
  }, {rootMargin:"-25% 0px -65% 0px"});
  TOC.forEach(t=>{ const s = document.getElementById(t.id); if(s) spy.observe(s); });
}

/* ---- language ---- */
function applyStatic(){
  document.documentElement.lang = KO() ? "ko" : "en";
  document.querySelectorAll("[data-en]").forEach(n=>{
    n.innerHTML = n.getAttribute("data-"+L) || n.getAttribute("data-en");
  });
  document.querySelectorAll("[data-en-ph]").forEach(n=>{
    n.placeholder = n.getAttribute("data-"+L+"-ph") || n.getAttribute("data-en-ph");
  });
  $("#btn-en").setAttribute("aria-pressed", String(!KO()));
  $("#btn-ko").setAttribute("aria-pressed", String(KO()));
}
function renderAll(){
  applyStatic();
  buildStats(); buildCatLegend(); buildRecord();
  buildSeg(); buildTreemap();
  buildCities(); buildAxLegend(); buildFavs();
  buildFilters(); buildChronicle();
  buildToc();
}
function setLang(v){
  L = v;
  try { localStorage.setItem("hj-lang", v); } catch(e){}
  hideTip(); renderAll();
}
$("#chron-q").addEventListener("input", e=>{ chronQ = e.target.value; buildChronicle(); });
$("#chron-toggle").addEventListener("click", ()=>{
  const visible = chronOpen || !!norm(chronQ);
  if (visible){ chronOpen = false; chronQ = ""; $("#chron-q").value = ""; }
  else { chronOpen = true; animateItems = true; }
  buildChronicle();
  if (chronOpen) $("#chron-panel").scrollIntoView({behavior:"smooth", block:"start"});
});
$("#chron-title").addEventListener("click", ()=> $("#chron-toggle").click());
$("#btn-en").addEventListener("click", ()=>setLang("en"));
$("#btn-ko").addEventListener("click", ()=>setLang("ko"));
let rt;
addEventListener("resize", ()=>{ clearTimeout(rt); rt = setTimeout(buildTreemap, 160); });
renderAll();
